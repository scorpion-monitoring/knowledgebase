# Vale 3.25.1, custom styles only (no downloaded packages). The rules in styles/Scorpion and
# styles/Terminology are generated by `pnpm vale:gen` from src/data/terms.ts.
StylesPath = styles
MinAlertLevel = error
Vocab = Scorpion

[formats]
mdx = md

[src/content/docs/**/*.{md,mdx}]
BasedOnStyles = Scorpion

[src/content/docs/terminology/**/*.{md,mdx}]
BasedOnStyles = Scorpion, Terminology
